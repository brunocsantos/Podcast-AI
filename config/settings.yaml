podcast:
  name: "Game Over Cast"
  language: "pt-BR"
  description: "Seu podcast diário de games gerado por IA. Notícias, análises e discussões sobre o mundo dos jogos com apresentadores virtuais."
  author_name: "Game Over Cast AI"
  author_email: ""
  artwork_url: ""  # URL da imagem de capa (1400x1400 a 3000x3000, JPEG/PNG) - obrigatório para Spotify
  hosts:
    - name: "Lucas"
      voice_id: "JBFqnCBsd6RMkjVDRZzb"
      personality: "Entusiasmado, adora jogos indie, faz piadas e referências a cultura pop"
    - name: "Marina"
      voice_id: "EXAVITQu4vr4xnSDxMaL"
      personality: "Analítica, fã de jogos competitivos, faz perguntas provocativas"
  target_duration_minutes: 15
  max_topics: 5

collector:
  lookback_hours: 24  # Últimas 24h para episódios diários
  feeds:
    - url: "https://www.ign.com/rss/articles"
      name: "IGN"
    - url: "https://www.pcgamer.com/rss/"
      name: "PC Gamer"
    - url: "https://www.eurogamer.net/feed"
      name: "Eurogamer"
    - url: "https://www.thegamer.com/feed/"
      name: "TheGamer"
    - url: "https://www.theenemy.com.br/feed"
      name: "The Enemy"

audio:
  tts_model: "eleven_multilingual_v2"
  output_format: "mp3_44100_128"
  silence_between_turns_ms: 300

publisher:
  storage_backend: "github_pages"  # Gratuito, sem cartão de crédito
  output_dir: "data/episodes"
  feed_path: "data/feed.xml"
  base_url: "https://brunocsantos.github.io/Podcast-AI"
  # Os arquivos são publicados na branch gh-pages automaticamente

scheduler:
  enabled: true
  hour: 8      # Hora de gerar o episódio (0-23)
  minute: 0    # Minuto (0-59)
  timezone: "America/Sao_Paulo"
